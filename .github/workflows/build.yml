name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # needed so the release step can upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest        # ships the PSPSDK toolchain
    steps:
      # The pspdev image is Alpine-based; the JS-based actions below need node,
      # and checkout needs git. zip packages the release, python3 runs
      # tools/patch-eflags.py, and curl plus build-base bootstrap rustup.
      - name: Install helpers
        run: apk add --no-cache nodejs git zip curl build-base python3

      - uses: actions/checkout@v4

      # rust/ builds for mipsel-sony-psp, a tier 3 target with no prebuilt std,
      # so it needs nightly and rust-src to compile core itself. Alpine's own
      # rust package is stable-only and cannot do that.
      - name: Install Rust nightly
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal \
                        --default-toolchain nightly --component rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Guards the port against the C++ it replaces. Runs on the host, where
      # the vectors in rust/tests were generated, so it needs no emulator.
      - name: Check the Rust port against the C++ vectors
        run: cd rust && cargo test --target x86_64-unknown-linux-musl

      - name: Build
        run: |
          export PSPDEV=/usr/local/pspdev
          export PATH="$PSPDEV/bin:$PATH"
          make clean && make

      # The version this build will be released as -- the tag for a tag build,
      # 'latest' otherwise, which is exactly what the Release step below tags it.
      # Computed once, in one place, so the zip name, the file inside it and the
      # release can never disagree about which build this is.
      - name: Work out the version
        run: |
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          else
            echo "VERSION=latest" >> "$GITHUB_ENV"
          fi

      - name: Package (EBOOT.PBP + data/)
        run: |
          export PSPDEV=/usr/local/pspdev
          export PATH="$PSPDEV/bin:$PATH"
          make dist
          # version.txt travels WITH the game, not just on the download page. A
          # zip gets unpacked onto a memory stick and its name is gone; six
          # months later "which build is this?" is answerable from the stick
          # itself, and a bug report can carry the commit that produced it.
          {
            echo "Deepslate $VERSION"
            echo "commit:  $GITHUB_SHA"
            echo "built:   $(date -u '+%Y-%m-%d %H:%M UTC')"
          } > build/version.txt
          mv build Deepslate
          zip -r "Deepslate-$VERSION.zip" Deepslate

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deepslate-${{ env.VERSION }}
          path: Deepslate-${{ env.VERSION }}.zip
      - name: Move "latest" tag
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git tag -f latest
          git push -f origin latest

      - name: Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: Deepslate-${{ env.VERSION }}.zip
          target_commitish: ${{ github.sha }}
          tag_name: ${{ env.VERSION }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest build' }}
